server {
    # Railway (and other PaaS) inject the port to bind via $PORT; the Docker
    # image's envsubst step fills it in at startup. Defaults to 80 locally.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
